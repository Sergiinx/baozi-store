spring.application.name=baozi-store

# Banco H2 gravando em arquivo (os dados nao somem quando a aplicacao reinicia)
spring.datasource.url=jdbc:h2:file:./data/baozidb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# O Hibernate cria/atualiza as tabelas sozinho a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Console web do H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
